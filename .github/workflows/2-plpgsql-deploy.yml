name: 2 - Deploy PL/pgSQL Procedure

on:
  push:
    branches:
      - main
    paths:
      # Only trigger if this exact file is modified
      - 'src/exponential_smoothing_pg.pls'
  # Allow manual redeploys, e.g. after the schema was recreated
  workflow_dispatch:

jobs:
  deploy-procedure:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Deploy PL/pgSQL Script
        run: |
          # Explicitly execute only this specific file.
          # ON_ERROR_STOP makes psql exit non-zero on SQL errors, so a failed deploy fails the job.
          psql "${{ secrets.SUPABASE_PSQL_URL }}" -v ON_ERROR_STOP=1 -f src/exponential_smoothing_pg.pls
